<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>日有进 · 个人助理</title><style>
:root{--bg:#f3f5f1;--paper:#fff;--ink:#20372f;--muted:#65776d;--green:#205c47;--soft:#e9f1eb;--line:#dce5dd;--gold:#eac779;--red:#ad423a}*{box-sizing:border-box}body{margin:0;font:16px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--green);border-radius:10px;min-height:44px;padding:8px 14px}button:hover{background:var(--soft)}button.primary{background:var(--green);color:white;border-color:var(--green)}button.danger{color:var(--red)}input,textarea,select{width:100%;border:1px solid #bdcec1;background:white;color:var(--ink);padding:10px;border-radius:9px;min-width:0}textarea{min-height:90px;resize:vertical}input[type=checkbox]{width:22px;height:22px;accent-color:var(--green)}:focus-visible{outline:3px solid #ce9a37;outline-offset:3px}h1,h2,h3,p{margin:0 0 12px}h1{font-size:30px;letter-spacing:-1px}h2{font-size:21px}h3{font-size:18px}small,.meta{font-size:14px;color:var(--muted)}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}aside{background:#173f31;color:white;padding:30px 20px;position:sticky;height:100vh;top:0;display:flex;flex-direction:column}.brand{font-size:28px;font-weight:800;letter-spacing:3px}.brand small{display:block;font-size:12px;color:#abc9b7;letter-spacing:2px}nav{display:grid;gap:8px;margin-top:35px}nav button{color:#d9e9df;text-align:left;border:0;background:transparent}nav button.active{background:#35634e;color:white}aside .foot{margin-top:auto;font-size:13px;color:#bad2c2}main{padding:30px 36px 100px;max-width:1400px;width:100%;margin:auto;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:26px}.date{width:160px}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.grid{display:grid;gap:18px;grid-template-columns:repeat(2,minmax(0,1fr))}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0;margin-bottom:18px}.stats .card{margin:0}.big{font-size:30px;font-weight:750;display:block}.lead{background:var(--green);color:white;border:0}.lead .meta{color:#d7e6dc}.lead button{background:#f1d696;color:#304a38;border:0}.section{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.task{padding:16px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}.task:first-child{border:0}.task .body{flex:1;min-width:0}.task strong{display:block;overflow-wrap:anywhere}.task.done strong{text-decoration:line-through;color:var(--muted)}.task .actions{margin-top:9px}.task .actions button{font-size:14px;padding:5px 10px}.tag{display:inline-block;font-size:12px;background:var(--soft);border-radius:6px;padding:3px 7px;margin:2px 4px 2px 0;color:var(--green)}.tag.warn{background:#fff0ce;color:#805b17}.empty{padding:24px 0;color:var(--muted)}.notice{border-left:3px solid #caa552;background:#fff7e5;padding:12px 16px;font-size:14px;margin:12px 0}.progress{height:9px;border-radius:9px;background:#e4ece5;overflow:hidden;margin:12px 0}.progress i{display:block;background:var(--green);height:100%}.milestone{border-top:1px solid var(--line);padding:13px 0;display:flex;gap:10px;align-items:start}.milestone>div{flex:1;min-width:0}.milestone p{overflow-wrap:anywhere;font-size:14px;margin:5px 0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:14px;font-weight:600;margin-bottom:12px}label input,label select,label textarea{margin-top:5px}.checklabel{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:400}.checklabel input{margin:0}.wide{grid-column:1/-1}dialog{border:0;border-radius:18px;padding:25px;width:min(620px,calc(100% - 28px));max-height:90dvh;overflow:auto;color:var(--ink);box-shadow:0 20px 80px #0004}dialog::backdrop{background:#152d2580}.dialoghead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.dialoghead h2{margin:0}.reporttext{white-space:pre-wrap;overflow-wrap:anywhere}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#163e30;color:white;border-radius:12px;padding:12px 20px;z-index:99;max-width:90%;box-shadow:0 4px 22px #0003}.hidden{display:none!important}.timer{font-variant-numeric:tabular-nums}.mobile{display:none}details summary{cursor:pointer;min-height:44px;padding:8px 0;font-weight:600}a{color:var(--green)}.log{padding:12px 0;border-top:1px solid var(--line)}.log p{white-space:pre-wrap;overflow-wrap:anywhere}.error{color:var(--red)}@media(max-width:800px){.shell{display:block}aside{display:none}main{padding:20px 16px 115px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}h1{font-size:25px}.stats{gap:8px}.stats .card{padding:13px 10px}.big{font-size:24px}.card{padding:18px}.mobile{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;margin:0;background:white;border-top:1px solid var(--line);padding:7px 3px calc(7px + env(safe-area-inset-bottom));z-index:9}.mobile button{padding:7px 0;font-size:14px;text-align:center;color:var(--muted);border-radius:8px}.mobile button.active{background:var(--soft);color:var(--green)}.formgrid{grid-template-columns:1fr}.toast{bottom:90px}.date{width:145px}}@media print{aside,.mobile,.top,.actions,button,.no-print{display:none!important}.shell,main{display:block;padding:0}.card{border:0;box-shadow:none}.grid{display:block}body{background:white}}
</style></head><body><div class="shell"><aside><div class="brand">日有进<small>ONE DAY AT A TIME</small></div><nav id="desktopNav"></nav><div class="foot">每天推进一点，留出余量。<br><br>个人版 V2 · 本机保存<br><span id="saveState">准备就绪</span></div></aside><main><header class="top"><div><small id="eyebrow">我的一天</small><h1 id="pageTitle">今天，先做好这几件事</h1></div><label class="date">查看日期<input type="date" id="date"></label></header><div id="app"></div></main></div><nav class="mobile" id="mobileNav"></nav><dialog id="modal"><div class="dialoghead"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="关闭">✕</button></div><form id="form"></form></dialog><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
'use strict';
const KEY='riyoujin-v2',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const weekday=d=>new Date(d+'T12:00:00Z').getUTCDay(),workday=d=>![0,6].includes(weekday(d));
function nextWorkday(d){do{d=addDays(d,1)}while(!workday(d));return d}
function weekRange(d){const start=addDays(d,-((weekday(d)+6)%7));return [start,addDays(start,6)]}
function monthRange(d){return [d.slice(0,7)+'-01',addDays(d.slice(0,7)+'-01',new Date(+d.slice(0,4),+d.slice(5,7),0).getDate()-1)]}
const inside=(d,a,b)=>!!d&&d>=a&&d<=b;
const domains={work:'公司工作',project:'个人项目',growth:'个人成长',sport:'运动健康'};
const projectDefs=[['sop','SOP 系统','从业务流程走向可复用产品',[['确认试点场景',10],['梳理流程与字段',15],['完成可操作工作台',25],['接通保存与分享',20],['完成公司试点验证',20],['整理产品与交付说明',10]]],['geo','GEO 系统','攻克监测、接口与优化流程',[['定义监测问题与样本',10],['建立关键词与内容结构',20],['接通接口和采集流程',25],['完成监测与对比',20],['验证一轮优化结果',15],['整理可复用产品',10]]],['video','AI 视频工作流','让制作流程真正跑通',[['确定视频类型与样片标准',10],['梳理素材和脚本流程',15],['接通关键 API',20],['跑通视频制作工作流',25],['完成样片并修复问题',20],['整理产品和使用说明',10]]]];
function fresh(){return {version:2,revision:0,tasks:[],logs:[],habits:{},events:[],reports:[],reviews:[],ideas:[],projects:projectDefs.map(([id,name,desc,ms])=>({id,name,desc,block:'',next:'',milestones:ms.map(([name,weight])=>({id:uid(),name,weight,done:false,evidence:'',date:''}))})),settings:{start:'09:00',end:'18:00',lunchStart:'12:00',lunchEnd:'13:30',buffer:30,reading:3,autoReport:false},timer:{mode:'work',running:false,remaining:5400000,end:0}}}
let state=fresh(),storageBroken=false,view='today',selected=today(),taskFilter='all';
try{const raw=localStorage.getItem(KEY);if(raw){const x=JSON.parse(raw);if(!validate(x))throw Error('invalid');state=x}}catch(e){storageBroken=true}
function validate(x){const date=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d);return x&&x.version===2&&Number.isFinite(x.revision)&&['tasks','logs','events','reports','reviews','ideas','projects'].every(k=>Array.isArray(x[k]))&&x.habits&&typeof x.habits==='object'&&x.settings&&/^\d\d:\d\d$/.test(x.settings.start)&&/^\d\d:\d\d$/.test(x.settings.end)&&Number.isFinite(+x.settings.buffer)&&x.timer&&['work','rest'].includes(x.timer.mode)&&Number.isFinite(x.timer.remaining)&&Number.isFinite(x.timer.end)&&x.projects.length===3&&x.projects.every(p=>typeof p.id==='string'&&Array.isArray(p.milestones)&&p.milestones.every(m=>typeof m.name==='string'&&Number.isFinite(m.weight)&&m.weight>0))&&x.tasks.every(t=>typeof t.id==='string'&&typeof t.name==='string'&&Object.keys(domains).includes(t.domain)&&(t.date===''||date(t.date))&&['todo','blocked','done'].includes(t.status)&&Number.isFinite(t.minutes)&&t.minutes>=0)&&x.logs.every(l=>date(l.date)&&typeof l.text==='string'&&Object.keys(domains).includes(l.domain)&&Number.isFinite(l.minutes))&&x.events.every(e=>date(e.date)&&typeof e.name==='string')&&x.reports.every(r=>typeof r.text==='string')&&x.reviews.every(r=>date(r.date))&&Object.values(x.habits).every(h=>h&&Array.isArray(h.english)&&h.english.length===4&&Number.isFinite(h.reading)&&typeof h.workout==='boolean')}
function notify(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(notify.t);notify.t=setTimeout(()=>$('#toast').classList.add('hidden'),4000)}
function save(){try{const disk=localStorage.getItem(KEY);if(disk&&JSON.parse(disk).revision>state.revision){notify('另一个窗口已有更新。请先导出本页备份，再重新打开，避免覆盖。');return false}state.revision++;localStorage.setItem(KEY,JSON.stringify(state));storageBroken=false;$('#saveState').textContent='已保存 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});return true}catch(e){storageBroken=true;$('#saveState').textContent='保存失败，请导出备份';notify('本机保存失败，请立即导出备份。');return false}}
function commit(msg='已保存'){const ok=save();render();if(ok&&msg)notify(msg)}
function habit(d){return state.habits[d]||{english:[false,false,false,false],englishMinutes:0,reading:0,pages:0,book:'',workout:false,workoutMinutes:0,workoutNote:''}}
function progress(p){return Math.round(p.milestones.filter(m=>m.done).reduce((a,m)=>a+m.weight,0)/p.milestones.reduce((a,m)=>a+m.weight,0)*100)}
const training=d=>({2:'下肢 · 臀腿',4:'上肢 · 肩背',6:'有氧 + 腹部',0:'有氧 + 腹部'}[weekday(d)]||'恢复日 · 可选拉伸或散步');
const btn=(text,action,id='',cls='')=>`<button type="button" class="${cls}" data-action="${action}" data-id="${esc(id)}">${text}</button>`;
function nav(){const items=[['today','今日'],['work','工作'],['projects','项目'],['growth','成长'],['more','我的']];for(const id of ['desktopNav','mobileNav'])$('#'+id).innerHTML=items.map(([k,n])=>`<button data-view="${k}" class="${view===k?'active':''}">${n}</button>`).join('')}
function taskList(tasks){tasks=tasks.slice().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||(a.time||'99:99').localeCompare(b.time||'99:99'));return tasks.length?tasks.map(t=>`<div class="task ${t.status==='done'?'done':''}"><div class="body"><strong>${esc(t.name)}</strong><div class="meta"><span class="tag">${domains[t.domain]}</span>${t.core?'<span class="tag warn">今日重点</span>':''}${t.status==='blocked'?'<span class="tag warn">等待反馈</span>':''} ${esc(t.date||'收件箱')} ${t.time?esc(t.time):''} · 预计 ${t.minutes} 分钟${t.deadline?' · 最晚 '+esc(t.deadline):''}</div>${t.note?`<div class="meta">${esc(t.note)}</div>`:''}<div class="actions">${t.status==='done'?btn('重新打开','reopen',t.id):btn('记录进展 / 完成','feedback',t.id)}${btn('编辑 / 改期','editTask',t.id)}${btn('归档','archive',t.id)}</div></div></div>`).join(''):'<div class="empty">这里还没有任务。先添加一件准备推进的事。</div>'}
function minOf(t){const [h,m]=t.split(':').map(Number);return h*60+m}
function capacity(){const s=state.settings;return Math.max(0,minOf(s.end)-minOf(s.start)-Math.max(0,Math.min(minOf(s.end),minOf(s.lunchEnd))-Math.max(minOf(s.start),minOf(s.lunchStart))))}
function render(){nav();$('#date').value=selected;const titles={today:['我的一天','今天，先做好这几件事'],work:['公司工作','安排与跟进'],projects:['个人项目','把想法推进成产品'],growth:['个人成长','学习、体验与训练'],more:['复盘与设置','记录，让进步看得见']};$('#eyebrow').textContent=titles[view][0];$('#pageTitle').textContent=titles[view][1];const warning=storageBroken?'<div class="notice error">本机数据读取或保存异常。请先导出备份；暂时不要清理浏览器数据。</div>':'';$('#app').innerHTML=warning+({today:renderToday,work:renderWork,projects:renderProjects,growth:renderGrowth,more:renderMore}[view])();updateTimer()}
function renderToday(){const tasks=state.tasks.filter(t=>!t.archived&&t.date===selected&&(workday(selected)||t.domain!=='work'));const company=tasks.filter(t=>t.domain==='work'),personal=tasks.filter(t=>t.domain!=='work');const pending=company.filter(t=>t.status!=='done').reduce((a,t)=>a+t.minutes,0),budget=Math.round(capacity()*(1-state.settings.buffer/100));const core=tasks.filter(t=>t.core);return `<div class="card lead"><div class="section"><div><small class="meta">${selected} · 星期${'日一二三四五六'[weekday(selected)]}</small><h2>${workday(selected)?'留出余量，先推进最重要的一件事':'周末，把时间留给自己'}</h2></div>${btn('＋ 临时任务','newTask','','primary')}</div><p class="meta">${workday(selected)?`公司工作建议安排不超过 ${budget} 分钟，保留 ${state.settings.buffer}% 缓冲。`:'常规公司任务已收起，学习、活动与训练照常。'}</p></div><div class="stats"><div class="card"><small>重点已完成</small><span class="big">${core.filter(t=>t.status==='done').length} / ${core.length}</span></div><div class="card"><small>公司待办预计</small><span class="big">${pending}<small> 分钟</small></span></div><div class="card"><small>今日训练</small><b style="display:block;margin-top:6px">${habit(selected).workout?'已完成':training(selected)}</b></div></div>${pending>budget?'<div class="notice">今天公司任务已超出建议容量。请在“编辑 / 改期”中选择移走一项，系统不会自动占用你的晚间学习时间。</div>':''}<div class="grid"><div class="card"><div class="section"><h2>公司工作</h2>${btn('全部工作','goWork')}</div>${workday(selected)?taskList(company):'<div class="empty">今天休息。公司任务可在工作页查看。</div>'}</div><div class="card"><div class="section"><h2>个人安排</h2>${btn('记录成长','goGrowth')}</div>${taskList(personal)}<div class="notice">英语：${habit(selected).english.filter(Boolean).length}/4 项 · 阅读：${habit(selected).reading} 分钟</div></div></div><div class="card"><div class="section"><div><h2>专注与休息</h2><p class="meta">工作 90 分钟 · 休息 10 分钟。午休和非工作时段自动暂停；离开电脑前请手动暂停。</p></div></div><div class="actions"><span class="big timer" id="timerText">90:00</span><span id="timerMode" class="tag"></span>${btn(state.timer.running?'暂停':'开始 / 继续','timerToggle')}${btn('重新计时','timerReset')}</div><small>仅网页内提醒。关闭页面后不推送；重新打开会恢复已保存的计时状态。</small></div><div class="card"><h2>先把想法记下来</h2><div class="actions"><input id="ideaInput" placeholder="一句话记录，不立即挤进今天的计划" aria-label="新想法" style="flex:1">${btn('存入想法库','addIdea')}</div>${state.ideas.slice(0,5).map(i=>`<div class="log">${esc(i.text)} <small>${i.date}</small> ${btn('转为任务','ideaTask',i.id)}</div>`).join('')}</div>`}
function renderWork(){let ts=state.tasks.filter(t=>t.domain==='work'&&!t.archived);if(taskFilter==='today')ts=ts.filter(t=>t.date===selected);if(taskFilter==='pending')ts=ts.filter(t=>t.status!=='done');if(taskFilter==='inbox')ts=ts.filter(t=>!t.date);ts.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));return `<div class="card"><div class="section"><h2>工作清单</h2>${btn('＋ 添加工作','newWork','','primary')}</div><label>查看范围<select id="taskFilter">${[['all','全部工作'],['today','所选日期'],['pending','尚未完成'],['inbox','待安排']].map(([v,n])=>`<option value="${v}" ${taskFilter===v?'selected':''}>${n}</option>`).join('')}</select></label>${taskList(ts)}</div><div class="card"><h2>所选日期的工作反馈</h2>${state.logs.filter(l=>l.domain==='work'&&l.date===selected).map(l=>`<div class="log"><b>${esc(l.name)}</b><p>${esc(l.text)}</p><small>实际 ${l.minutes} 分钟 · ${l.done?'已完成':'继续推进'}</small></div>`).join('')||'<p class="empty">尚无反馈。任务的预计时长不会计为实际工时。</p>'}${btn('整理公司日报','daily','','primary')}</div>`}
function renderProjects(){return state.projects.map(p=>`<div class="card"><div class="section"><div><small>${esc(p.desc)}</small><h2>${esc(p.name)}</h2></div><span class="big">${progress(p)}%</span></div><div class="progress"><i style="width:${progress(p)}%"></i></div><small>已验收权重 / 全部里程碑权重 · 初始 0% 表示尚未录入验收成果</small><div class="notice">下一步：${esc(p.next||'先确认当前阶段，再选择一个小步骤')}<br>卡点：${esc(p.block||'尚未记录')}</div><div class="actions">${btn('更新下一步与卡点','projectNote',p.id)}${btn('＋ 项目任务','projectTask',p.id)}</div><details><summary>里程碑 · ${p.milestones.filter(m=>m.done).length} / ${p.milestones.length} 已验收</summary>${p.milestones.map(m=>`<div class="milestone"><span>${m.done?'✓':'○'}</span><div><b>${esc(m.name)}</b> <small>${m.weight}%</small>${m.done?`<p>${esc(m.evidence)}</p><small>验收日期 ${esc(m.date)}</small>`:''}</div>${btn(m.done?'修改验收':'验收','milestone',p.id+':'+m.id)}</div>`).join('')}</details><details><summary>项目任务</summary>${taskList(state.tasks.filter(t=>!t.archived&&t.project===p.id))}</details></div>`).join('')}
function renderGrowth(){const h=habit(selected),[a,b]=weekRange(selected),hs=Object.entries(state.habits).filter(([d])=>inside(d,a,b)),halfStart=selected.slice(0,8)+(+selected.slice(8)<=15?'01':'16'),halfEnd=+selected.slice(8)<=15?selected.slice(0,8)+'15':monthRange(selected)[1],events=state.events.filter(e=>inside(e.date,halfStart,halfEnd)&&e.attended);return `<div class="stats"><div class="card"><small>本周阅读</small><span class="big">${hs.filter(([,v])=>v.reading>0).length}/${state.settings.reading}<small> 天</small></span></div><div class="card"><small>本周训练</small><span class="big">${hs.filter(([,v])=>v.workout).length}/4<small> 天</small></span></div><div class="card"><small>本半月已参加活动</small><span class="big">${events.length}/1<small> 次</small></span></div></div><div class="grid"><div class="card"><h2>英语 · 每天一小时</h2><p class="meta">三句话日记、跟读、听力、阅读一页。四项时间可以灵活分配。</p>${['影子跟读 Shadowing','三句话英语日记','英语听力','阅读一页英文书'].map((n,i)=>`<label class="checklabel"><input type="checkbox" data-english="${i}" ${h.english[i]?'checked':''}>${n}</label>`).join('')}<label>今天实际英语时长（分钟）<input id="englishMinutes" type="number" min="0" max="1440" value="${h.englishMinutes||0}"></label>${btn('保存英语记录','saveEnglish','','primary')}<p class="meta" style="margin-top:12px">本周 ${hs.filter(([,v])=>v.english.some(Boolean)).length} 天有训练记录</p></div><div class="card"><h2>阅读与训练</h2><label>正在读的书<input id="book" value="${esc(h.book)}" placeholder="书名"></label><div class="formgrid"><label>阅读分钟<input id="reading" type="number" min="0" max="1440" value="${h.reading}"></label><label>阅读页数<input id="pages" type="number" min="0" max="9999" value="${h.pages}"></label></div><p><span class="tag">今日建议</span> ${training(selected)}</p><label class="checklabel"><input id="workout" type="checkbox" ${h.workout?'checked':''}>今天已完成一次训练</label><label>训练分钟<input id="workoutMinutes" type="number" min="0" max="1440" value="${h.workoutMinutes||0}"></label><label>训练内容 / 感受<textarea id="workoutNote">${esc(h.workoutNote)}</textarea></label>${btn('保存阅读与训练','saveHealth','','primary')}<small style="display:block;margin-top:8px">同一天力量、有氧和腹部合计为一个训练日。</small></div></div><div class="card"><div class="section"><div><h2>外出学习与活动</h2><small>当前半月：${halfStart} 至 ${halfEnd} · 报名不计入完成</small></div>${btn('＋ 活动','event','','primary')}</div>${state.events.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<div class="log"><b>${esc(e.name)}</b> <span class="tag">${e.attended?'已参加':'计划参加'}</span><small>${e.date}</small><p>${esc(e.note)}</p>${btn('编辑 / 记录收获','event',e.id)}</div>`).join('')||'<p class="empty">安排一次分享会、展览或交流活动，给自己一些新体验。</p>'}</div>`}
function renderMore(){return `<div class="card"><h2>日报、周报与月度总结</h2><p class="meta">公司报告与个人总结分别生成。报告会保存为可编辑版本，不向他人发送。</p><div class="actions">${btn('公司日报','daily','','primary')}${btn('公司周报','workweek')}${btn('公司月报','workmonth')}${btn('个人周总结','personalweek')}${btn('个人月总结','personalmonth')}</div>${state.reports.slice().reverse().slice(0,20).map(r=>`<div class="log"><b>${esc(r.title)}</b> <small>第 ${r.version} 版 · ${esc(r.created.slice(0,16).replace('T',' '))}</small> ${btn('查看 / 编辑 / 导出','report',r.id)}</div>`).join('')||'<p class="empty">还没有报告。记录任务进展后，就可以整理第一份日报。</p>'}</div><div class="card"><h2>个人复盘</h2><p class="meta">${selected} · 今天做得好的事、遇到的困难、下一步</p><textarea id="reflection" placeholder="简单写几句就好">${esc(state.reviews.find(r=>r.date===selected)?.text||'')}</textarea><div class="actions">${btn('保存复盘','reflection','','primary')}</div><details><summary>历史复盘</summary>${state.reviews.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div class="log"><b>${r.date}</b><p>${esc(r.text)}</p></div>`).join('')}</details></div><div class="card"><h2>我的设置</h2><div class="formgrid">${[['start','上班时间'],['end','下班时间'],['lunchStart','午休开始'],['lunchEnd','午休结束']].map(([k,n])=>`<label>${n}<input type="time" id="${k}" value="${state.settings[k]}"></label>`).join('')}<label>工作缓冲（%）<input id="buffer" type="number" min="0" max="60" value="${state.settings.buffer}"></label><label>每周阅读目标（天）<input id="readingGoal" type="number" min="1" max="7" value="${state.settings.reading}"></label></div><label class="checklabel"><input id="autoReport" type="checkbox" ${state.settings.autoReport?'checked':''}>工作日 18:00，网页打开时整理公司日报</label><p class="meta">按北京时间执行；当天18:00后打开会补生成一次。关闭网页后不会运行，后台提醒与云端同步尚未接通。</p>${btn('保存设置','settings','','primary')}</div><div class="card"><h2>备份与使用说明</h2><p>所有记录保存在当前浏览器。手机和电脑需要手动导出、导入备份；导入会替换当前数据，不会合并。建议每周保存一次备份。</p><div class="actions">${btn('导出全部备份 JSON','export','','primary')}${btn('导入 V2 备份','import')}${btn('归档任务','archived')}${btn('清空全部记录','clear','','danger')}</div><input id="importFile" type="file" accept=".json,application/json" hidden><details><summary>怎样开始使用</summary><p>① 今日添加工作或个人任务，最多标记三件重点。<br>② 做完一部分或全部后，点击“记录进展 / 完成”。<br>③ 成长页记录英语、阅读、训练和活动。<br>④ 项目页录入验收成果，更新产品进度。<br>⑤ 我的页面生成报告并保存备份。</p><p>没有预置虚构成绩。旧版 Demo 的数据不会自动混入本版。重复任务目前通过每日成长计划体现，工作任务需按需添加。浏览器预览若限制保存或下载，请下载此 HTML 后用 Chrome 或 Edge 打开。</p></details></div>`}
function openForm(title,html,handler){$('#modalTitle').textContent=title;$('#form').innerHTML=html;$('#form').onsubmit=e=>{e.preventDefault();handler(new FormData($('#form')))};$('#modal').showModal()}
const field=(name,label,value='',type='text',extra='')=>`<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;
const area=(name,label,value='')=>`<label>${label}<textarea name="${name}">${esc(value)}</textarea></label>`;
const submit=label=>`<div class="actions"><button class="primary" type="submit">${label}</button></div>`;
function taskForm(id,domain='work',project='',name=''){const t=state.tasks.find(t=>t.id===id)||{name,domain,project,date:domain==='work'&&!workday(selected)?nextWorkday(selected):selected,minutes:30,status:'todo',time:'',deadline:'',note:'',core:false};openForm(id?'编辑任务':'添加任务',field('name','准备完成什么',t.name,'text','required maxlength="200"')+`<div class="formgrid"><label>所属板块<select name="domain">${Object.entries(domains).map(([k,n])=>`<option value="${k}" ${t.domain===k?'selected':''}>${n}</option>`).join('')}</select></label><label>关联个人项目（可选）<select name="project"><option value="">不关联</option>${state.projects.map(p=>`<option value="${p.id}" ${p.id===t.project?'selected':''}>${p.name}</option>`).join('')}</select></label>${field('date','计划日期（留空放入收件箱）',t.date,'date')}${field('time','开始时间（可不填）',t.time,'time')}${field('minutes','预计分钟',t.minutes,'number','min="1" max="1440" required')}${field('deadline','最晚完成日期',t.deadline,'date')}</div><label class="checklabel"><input name="core" type="checkbox" ${t.core?'checked':''}>设为当天重点（最多三件）</label><label>当前状态<select name="status">${[['todo','待推进'],['blocked','等待反馈'],['done','已完成']].filter(([k])=>k!=='done'||t.status==='done').map(([k,n])=>`<option value="${k}" ${t.status===k?'selected':''}>${n}</option>`).join('')}</select></label>`+area('note','备注 / 等待谁反馈',t.note)+submit('保存任务'),f=>{const date=f.get('date'),domain=f.get('domain'),time=f.get('time'),minutes=+f.get('minutes'),core=f.has('core');if(domain==='work'&&date&&!workday(date)){notify('公司任务请选择周一至周五；留空可以暂存。');return}if(core&&(!date||state.tasks.filter(x=>!x.archived&&x.id!==id&&x.date===date&&x.core).length>=3)){notify('重点需要指定日期，每天最多三件。');return}if(date&&time){const overlap=state.tasks.some(x=>!x.archived&&x.id!==id&&x.date===date&&x.time&&minOf(time)<minOf(x.time)+x.minutes&&minOf(time)+minutes>minOf(x.time));if(overlap){notify('这个时间与已有任务重叠，请改时间或留空。');return}if(domain==='work'&&(minOf(time)<minOf(state.settings.start)||minOf(time)+minutes>minOf(state.settings.end)||(minOf(time)<minOf(state.settings.lunchEnd)&&minOf(time)+minutes>minOf(state.settings.lunchStart)))){notify('请安排在公司工作时段内，并避开午休。');return}}const item={...t,id:id||uid(),name:f.get('name').trim(),domain,project:f.get('project'),date,time,minutes,deadline:f.get('deadline'),core,status:f.get('status'),note:f.get('note'),archived:false};if(!item.name)return;if(id)state.tasks=state.tasks.map(x=>x.id===id?item:x);else state.tasks.push(item);$('#modal').close();commit('任务已保存，不会自动移动其他安排。')})}
function feedback(id){const t=state.tasks.find(x=>x.id===id);openForm('记录进展',`<p>${esc(t.name)}</p>`+field('date','实际发生日期',selected,'date','required')+area('text','这次完成了什么 / 还有什么卡点')+field('minutes','这次实际投入分钟',0,'number','min="0" max="1440" required')+`<label class="checklabel"><input name="done" type="checkbox">这项任务已经全部完成</label>`+submit('保存进展'),f=>{if(f.get('date')>today()){notify('实际进展日期不能晚于今天。');return}if(!f.get('text').trim()){notify('请写一句实际进展，再保存。');return}state.logs.push({id:uid(),taskId:id,name:t.name,domain:t.domain,project:t.project,date:f.get('date'),text:f.get('text').trim(),minutes:+f.get('minutes'),done:f.has('done')});if(f.has('done')){t.status='done';t.completedAt=f.get('date')}$('#modal').close();commit('进展已保存，报告将按实际发生日期统计。')})}
function reportData(kind,d){let [a,b]=kind.includes('week')?weekRange(d):kind.includes('month')?monthRange(d):[d,d];b=b>d?d:b;const work=!kind.startsWith('personal');const logs=state.logs.filter(l=>inside(l.date,a,b)&&(work?l.domain==='work':l.domain!=='work'));const lines=[`${work?'公司':'个人'}${kind.includes('week')?'周':kind.includes('month')?'月':'日'}总结`,`${a} 至 ${b}（截至所选日期）`,'','一、实际进展',...logs.map(l=>`• ${l.date} ${l.name}：${l.text}${l.done?' [完成]':''}`)];if(!logs.length)lines.push('尚无实际进展反馈，不推断完成情况。');lines.push('',`记录的实际投入：${logs.reduce((s,l)=>s+l.minutes,0)} 分钟（不含未记录工时）`);if(work){const pending=state.tasks.filter(t=>!t.archived&&t.domain==='work'&&t.status!=='done'&&(!t.date||t.date<=b));lines.push('','二、待跟进 / 阻碍',...pending.map(t=>`• ${t.name}${t.status==='blocked'?' [等待反馈]':''}${t.note?'：'+t.note:''}`));if(!pending.length)lines.push('暂无已记录的待跟进事项。');lines.push('',`三、下一工作日 ${nextWorkday(b)}`, ...state.tasks.filter(t=>!t.archived&&t.domain==='work'&&t.date===nextWorkday(b)&&t.status!=='done').map(t=>'• '+t.name),'请结合实际情况补充下一步。')}else{const hs=Object.entries(state.habits).filter(([d])=>inside(d,a,b));lines.push('','二、成长与运动',`英语训练：${hs.filter(([,h])=>h.english.some(Boolean)).length} 天，实际 ${hs.reduce((s,[,h])=>s+(h.englishMinutes||0),0)} 分钟`,`阅读：${hs.filter(([,h])=>h.reading>0).length} 天，${hs.reduce((s,[,h])=>s+h.reading,0)} 分钟，${hs.reduce((s,[,h])=>s+h.pages,0)} 页`,`训练：${hs.filter(([,h])=>h.workout).length} 天`,`已参加活动：${state.events.filter(e=>e.attended&&inside(e.date,a,b)).length} 次`,'','三、期间验收成果',...state.projects.flatMap(p=>p.milestones.filter(m=>m.done&&inside(m.date,a,b)).map(m=>`• ${p.name} / ${m.name}：${m.evidence}`)),'','四、个人复盘',...state.reviews.filter(r=>inside(r.date,a,b)).map(r=>`${r.date}：${r.text}`))}return lines.join('\n')}
function makeReport(kind,d=selected,auto=false){if(kind==='daily'&&!workday(d)){notify('周末不生成公司日报。');return}const key=kind+':'+d,old=state.reports.filter(r=>r.key===key),text=reportData(kind,d),r={id:uid(),key,kind,date:d,title:({daily:'公司日报',workweek:'公司周报',workmonth:'公司月报',personalweek:'个人周总结',personalmonth:'个人月总结'}[kind])+' · '+d,version:old.length+1,text,created:new Date().toISOString(),auto};state.reports.push(r);commit(auto?'今天的公司日报已整理，可在“我的”查看。':'报告草稿已保存');if(!auto)showReport(r.id)}
function download(name,text,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function showReport(id){const r=state.reports.find(x=>x.id===id);openForm(r.title,area('text','报告内容（可修改后另存一版）',r.text)+`<div class="actions"><button type="submit" class="primary">保存新版本</button>${btn('导出 TXT','exportReport',r.id)}</div>`,f=>{state.reports.push({...r,id:uid(),text:f.get('text'),version:state.reports.filter(x=>x.key===r.key).length+1,created:new Date().toISOString(),auto:false});$('#modal').close();commit('新版本已保存，原版本保留。')})}
function eventForm(id){const e=state.events.find(x=>x.id===id)||{name:'',date:selected,note:'',attended:false};openForm('外出学习与活动',field('name','活动名称',e.name,'text','required maxlength="200"')+field('date','活动日期',e.date,'date','required')+area('note','地点 / 收获 / 下一步',e.note)+`<label class="checklabel"><input type="checkbox" name="attended" ${e.attended?'checked':''}>我已经参加了</label>`+submit('保存活动'),f=>{const item={id:id||uid(),name:f.get('name').trim(),date:f.get('date'),note:f.get('note'),attended:f.has('attended')};if(item.attended&&item.date>today()){notify('未来的活动请先标记为计划参加。');return}if(state.events.some(x=>x.id!==id&&x.name===item.name&&x.date===item.date)){notify('同日同名活动已经存在，请编辑原记录。');return}if(id)state.events=state.events.map(x=>x.id===id?item:x);else state.events.push(item);$('#modal').close();commit()})}
function validNum(v,max=1440){return Number.isFinite(+v)&&+v>=0&&+v<=max}
function inWorkTime(){const d=today(),parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date()),n=minOf(parts),s=state.settings;return workday(d)&&n>=minOf(s.start)&&n<minOf(s.end)&&!(n>=minOf(s.lunchStart)&&n<minOf(s.lunchEnd))}
function updateTimer(){const t=state.timer,remaining=t.running?Math.max(0,t.end-Date.now()):t.remaining;if($('#timerText'))$('#timerText').textContent=`${Math.floor(remaining/60000).toString().padStart(2,'0')}:${Math.floor(remaining/1000%60).toString().padStart(2,'0')}`;if($('#timerMode'))$('#timerMode').textContent=(t.mode==='work'?'专注':'休息')+(t.running?' · 进行中':' · 已暂停')}
const actions={newTask:()=>taskForm(),newWork:()=>taskForm('', 'work'),editTask:id=>taskForm(id),feedback,reopen:id=>{const t=state.tasks.find(x=>x.id===id);t.status='todo';delete t.completedAt;commit('任务已重新打开，历史反馈保留。')},archive:id=>{state.tasks.find(t=>t.id===id).archived=true;commit('已归档，可在“我的”中恢复。')},restore:id=>{state.tasks.find(t=>t.id===id).archived=false;$('#modal').close();commit('已恢复任务')},goWork:()=>{view='work';render()},goGrowth:()=>{view='growth';render()},projectTask:id=>taskForm('', 'project',id),projectNote:id=>{const p=state.projects.find(x=>x.id===id);openForm('项目下一步',area('next','下一次准备推进什么',p.next)+area('block','目前卡在哪里',p.block)+submit('保存'),f=>{p.next=f.get('next');p.block=f.get('block');$('#modal').close();commit()})},milestone:id=>{const [pid,mid]=id.split(':'),p=state.projects.find(x=>x.id===pid),m=p.milestones.find(x=>x.id===mid);openForm('里程碑验收',`<p>${esc(m.name)} · 权重 ${m.weight}%</p>`+area('evidence','成果说明 / 文档或产品链接',m.evidence)+field('date','实际验收日期',m.date||selected,'date','required')+`<label class="checklabel"><input type="checkbox" name="done" ${m.done?'checked':''}>已验证并完成这个阶段</label>`+submit('保存验收'),f=>{if(f.has('done')&&(!f.get('evidence').trim()||f.get('date')>today())){notify('请填写成果，验收日期不能晚于今天。');return}m.done=f.has('done');m.evidence=f.get('evidence');m.date=f.get('date');$('#modal').close();commit('项目进度已更新')})},event:eventForm,saveEnglish:()=>{if(selected>today()){notify('请在实际训练当天或之后补录。');return}const n=$('#englishMinutes').value;if(!validNum(n)){notify('请填写0–1440分钟。');return}const h=habit(selected);h.english=[...document.querySelectorAll('[data-english]')].map(e=>e.checked);h.englishMinutes=+n;state.habits[selected]=h;commit('英语训练已按日期保存。')},saveHealth:()=>{if(selected>today()){notify('请在实际阅读或训练当天补录。');return}if(!['reading','workoutMinutes'].every(k=>validNum($('#'+k).value))||!validNum($('#pages').value,9999)){notify('请填写有效的分钟与页数。');return}const h=habit(selected);Object.assign(h,{book:$('#book').value,reading:+$('#reading').value,pages:+$('#pages').value,workout:$('#workout').checked,workoutMinutes:+$('#workoutMinutes').value,workoutNote:$('#workoutNote').value});state.habits[selected]=h;commit('阅读与训练已保存，同一天不会重复计数。')},reflection:()=>{const text=$('#reflection').value.trim();state.reviews=state.reviews.filter(x=>x.date!==selected);if(text)state.reviews.push({date:selected,text});commit()},settings:()=>{const vals=Object.fromEntries(['start','end','lunchStart','lunchEnd'].map(k=>[k,$('#'+k).value]));if(Object.values(vals).some(v=>!v)||minOf(vals.end)<=minOf(vals.start)||minOf(vals.lunchEnd)<minOf(vals.lunchStart)||!validNum($('#buffer').value,60)||+$('#readingGoal').value<1||+$('#readingGoal').value>7){notify('请检查时间、缓冲比例与阅读目标。');return}Object.assign(state.settings,vals,{buffer:+$('#buffer').value,reading:+$('#readingGoal').value,autoReport:$('#autoReport').checked});commit()},timerToggle:()=>{const t=state.timer;if(t.running){t.remaining=Math.max(0,t.end-Date.now());t.running=false}else{if(!inWorkTime()){notify('当前不在设定的工作时段，休息一下吧。');return}t.running=true;t.end=Date.now()+t.remaining}commit('')},timerReset:()=>{state.timer={mode:'work',running:false,remaining:5400000,end:0};commit('计时已重置')},addIdea:()=>{const text=$('#ideaInput').value.trim();if(text){state.ideas.unshift({id:uid(),text,date:selected});commit('想法已保存')}} ,ideaTask:id=>taskForm('', 'project','',state.ideas.find(i=>i.id===id).text),daily:()=>makeReport('daily'),workweek:()=>makeReport('workweek'),workmonth:()=>makeReport('workmonth'),personalweek:()=>makeReport('personalweek'),personalmonth:()=>makeReport('personalmonth'),report:showReport,exportReport:id=>{const r=state.reports.find(x=>x.id===id);download(r.title+'.txt',$('#form textarea')?.value??r.text)},export:()=>download('日有进备份_'+today()+'.json',JSON.stringify(state,null,2),'application/json'),import:()=>$('#importFile').click(),archived:()=>openForm('归档任务',state.tasks.filter(t=>t.archived).map(t=>`<div class="log">${esc(t.name)} ${btn('恢复','restore',t.id)}</div>`).join('')||'<p>没有归档任务。</p>',()=>{}),clear:()=>openForm('清空全部记录','<div class="notice">将清空本版任务、反馈、成长记录、项目验收、报告和设置。请先导出备份。</div>'+field('confirm','输入“清空”确认')+submit('确认清空'),f=>{if(f.get('confirm')!=='清空'){notify('请输入“清空”。');return}const rev=state.revision;state=fresh();state.revision=rev;$('#modal').close();commit('全部记录已清空')})};
document.addEventListener('click',e=>{const n=e.target.closest('[data-view]');if(n){view=n.dataset.view;render();window.scrollTo(0,0);return}const b=e.target.closest('[data-action]');if(b&&actions[b.dataset.action])actions[b.dataset.action](b.dataset.id)});
$('#closeModal').onclick=()=>$('#modal').close();$('#date').onchange=e=>{if(e.target.value){selected=e.target.value;render()}};
document.addEventListener('change',async e=>{if(e.target.id==='taskFilter'){taskFilter=e.target.value;render()}if(e.target.id==='importFile'){const file=e.target.files[0];if(!file)return;try{if(file.size>10000000)throw Error();const x=JSON.parse(await file.text());if(!validate(x))throw Error();openForm('导入备份',`<p>包含 ${x.tasks.length} 项任务、${x.logs.length} 条反馈、${x.reports.length} 份报告。将替换当前所有记录，请先导出当前备份。</p>`+field('confirm','输入“替换”确认')+submit('替换并导入'),f=>{if(f.get('confirm')!=='替换')return;const rev=state.revision;state=x;state.revision=rev;state.timer.running=false;$('#modal').close();commit('备份已导入')})}catch(err){notify('导入失败：需要完整的 V2 备份（不超过10MB），当前数据未改变。')}}});
window.addEventListener('storage',e=>{if(e.key===KEY)notify('另一个窗口更新了数据。请保存草稿后重新打开本页。')});
setInterval(()=>{const t=state.timer;if(t.running&&!inWorkTime()){t.remaining=Math.max(0,t.end-Date.now());t.running=false;commit('已到休息或非工作时段，计时暂停。')}else if(t.running&&Date.now()>=t.end){const was=t.mode;state.timer={mode:was==='work'?'rest':'work',running:false,remaining:was==='work'?600000:5400000,end:0};commit(was==='work'?'已专注90分钟，起身休息10分钟吧。':'休息结束，准备好后再开始。')}updateTimer();const now=today(),time=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date());if(state.settings.autoReport&&workday(now)&&time>='18:00'&&!state.reports.some(r=>r.key==='daily:'+now))makeReport('daily',now,true)},1000);
render();
