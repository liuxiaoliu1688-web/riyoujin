<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>日有进 · 个人助理</title><style>
:root{--bg:#f3f5f1;--paper:#fff;--ink:#20372f;--muted:#65776d;--green:#205c47;--soft:#e9f1eb;--line:#dce5dd;--gold:#eac779;--red:#ad423a}*{box-sizing:border-box}body{margin:0;font:16px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--green);border-radius:10px;min-height:44px;padding:8px 14px}button:hover{background:var(--soft)}button.primary{background:var(--green);color:white;border-color:var(--green)}button.danger{color:var(--red)}input,textarea,select{width:100%;border:1px solid #bdcec1;background:white;color:var(--ink);padding:10px;border-radius:9px;min-width:0}textarea{min-height:90px;resize:vertical}input[type=checkbox]{width:22px;height:22px;accent-color:var(--green)}:focus-visible{outline:3px solid #ce9a37;outline-offset:3px}h1,h2,h3,p{margin:0 0 12px}h1{font-size:30px;letter-spacing:-1px}h2{font-size:21px}h3{font-size:18px}small,.meta{font-size:14px;color:var(--muted)}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}aside{background:#173f31;color:white;padding:30px 20px;position:sticky;height:100vh;top:0;display:flex;flex-direction:column}.brand{font-size:28px;font-weight:800;letter-spacing:3px}.brand small{display:block;font-size:12px;color:#abc9b7;letter-spacing:2px}nav{display:grid;gap:8px;margin-top:35px}nav button{color:#d9e9df;text-align:left;border:0;background:transparent}nav button.active{background:#35634e;color:white}aside .foot{margin-top:auto;font-size:13px;color:#bad2c2}main{padding:30px 36px 100px;max-width:1400px;width:100%;margin:auto;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:26px}.date{width:160px}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.grid{display:grid;gap:18px;grid-template-columns:repeat(2,minmax(0,1fr))}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0;margin-bottom:18px}.stats .card{margin:0}.big{font-size:30px;font-weight:750;display:block}.lead{background:var(--green);color:white;border:0}.lead .meta{color:#d7e6dc}.lead button{background:#f1d696;color:#304a38;border:0}.section{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.task{padding:16px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}.task:first-child{border:0}.task .body{flex:1;min-width:0}.task strong{display:block;overflow-wrap:anywhere}.task.done strong{text-decoration:line-through;color:var(--muted)}.task .actions{margin-top:9px}.task .actions button{font-size:14px;padding:5px 10px}.tag{display:inline-block;font-size:12px;background:var(--soft);border-radius:6px;padding:3px 7px;margin:2px 4px 2px 0;color:var(--green)}.tag.warn{background:#fff0ce;color:#805b17}.empty{padding:24px 0;color:var(--muted)}.notice{border-left:3px solid #caa552;background:#fff7e5;padding:12px 16px;font-size:14px;margin:12px 0}.progress{height:9px;border-radius:9px;background:#e4ece5;overflow:hidden;margin:12px 0}.progress i{display:block;background:var(--green);height:100%}.milestone{border-top:1px solid var(--line);padding:13px 0;display:flex;gap:10px;align-items:start}.milestone>div{flex:1;min-width:0}.milestone p{overflow-wrap:anywhere;font-size:14px;margin:5px 0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:14px;font-weight:600;margin-bottom:12px}label input,label select,label textarea{margin-top:5px}.checklabel{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:400}.checklabel input{margin:0}.wide{grid-column:1/-1}dialog{border:0;border-radius:18px;padding:25px;width:min(620px,calc(100% - 28px));max-height:90dvh;overflow:auto;color:var(--ink);box-shadow:0 20px 80px #0004}dialog::backdrop{background:#152d2580}.dialoghead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.dialoghead h2{margin:0}.reporttext{white-space:pre-wrap;overflow-wrap:anywhere}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#163e30;color:white;border-radius:12px;padding:12px 20px;z-index:99;max-width:90%;box-shadow:0 4px 22px #0003}.hidden{display:none!important}.timer{font-variant-numeric:tabular-nums}.mobile{display:none}details summary{cursor:pointer;min-height:44px;padding:8px 0;font-weight:600}a{color:var(--green)}.log{padding:12px 0;border-top:1px solid var(--line)}.log p{white-space:pre-wrap;overflow-wrap:anywhere}.error{color:var(--red)}@media(max-width:800px){.shell{display:block}aside{display:none}main{padding:20px 16px 115px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}h1{font-size:25px}.stats{gap:8px}.stats .card{padding:13px 10px}.big{font-size:24px}.card{padding:18px}.mobile{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;margin:0;background:white;border-top:1px solid var(--line);padding:7px 3px calc(7px + env(safe-area-inset-bottom));z-index:9}.mobile button{padding:7px 0;font-size:14px;text-align:center;color:var(--muted);border-radius:8px}.mobile button.active{background:var(--soft);color:var(--green)}.formgrid{grid-template-columns:1fr}.toast{bottom:90px}.date{width:145px}}@media print{aside,.mobile,.top,.actions,button,.no-print{display:none!important}.shell,main{display:block;padding:0}.card{border:0;box-shadow:none}.grid{display:block}body{background:white}}
.focus-title{font-size:clamp(22px,3vw,32px);line-height:1.4;overflow-wrap:anywhere}.goal-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.goal-grid .card{margin:0}.soft-button{display:inline-block;padding:10px 14px;background:var(--soft);border-radius:10px}.week-banner{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}.small-stack{display:grid;gap:10px}.muted-link{font-size:14px}.lead .tag{background:#ffffff22;color:white}.card p:last-child{margin-bottom:0}@media(max-width:800px){.goal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.section{flex-wrap:wrap}.focus-title{font-size:24px}.top{gap:8px}.date{width:135px}}
.coach-stack{display:grid;gap:0}.coach-card{border-left:5px solid var(--green)}.coach-card.coach-done{border-left-color:#91b49a;background:#f7fbf7}.coach-done h2{color:var(--muted)}.coach-card h2{font-size:24px;line-height:1.5}.coach-card .notice{border-left:0;border-radius:9px;background:var(--soft)}@media(max-width:800px){.coach-card h2{font-size:21px}}
</style></head><body><div class="shell"><aside><div class="brand">日有进<small>ONE DAY AT A TIME</small></div><nav id="desktopNav"></nav><div class="foot">每天推进一点，留出余量。<br><br>个人版 V4.0 · 本机保存<br><span id="saveState">准备就绪</span></div></aside><main><header class="top"><div><small id="eyebrow">我的一天</small><h1 id="pageTitle">今天，先做好这几件事</h1></div><label class="date">查看日期<input type="date" id="date"></label></header><div id="app"></div></main></div><nav class="mobile" id="mobileNav"></nav><dialog id="modal"><div class="dialoghead"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="关闭">✕</button></div><form id="form"></form></dialog><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
'use strict';
const KEY='riyoujin-v2',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const weekday=d=>new Date(d+'T12:00:00Z').getUTCDay(),workday=d=>![0,6].includes(weekday(d))&&!inside(d,state?.planner?.holiday?.start,state?.planner?.holiday?.end);
function nextWorkday(d){do{d=addDays(d,1)}while(!workday(d));return d}
function weekRange(d){const start=addDays(d,-((weekday(d)+6)%7));return [start,addDays(start,6)]}
function monthRange(d){return [d.slice(0,7)+'-01',addDays(d.slice(0,7)+'-01',new Date(+d.slice(0,4),+d.slice(5,7),0).getDate()-1)]}
const inside=(d,a,b)=>!!d&&d>=a&&d<=b;
const domains={work:'公司工作',project:'个人项目',growth:'个人成长',sport:'运动健康'};
const projectDefs=[['sop','SOP 系统','从业务流程走向可复用产品',[['确认试点场景',10],['梳理流程与字段',15],['完成可操作工作台',25],['接通保存与分享',20],['完成公司试点验证',20],['整理产品与交付说明',10]]],['geo','GEO 系统','攻克监测、接口与优化流程',[['定义监测问题与样本',10],['建立关键词与内容结构',20],['接通接口和采集流程',25],['完成监测与对比',20],['验证一轮优化结果',15],['整理可复用产品',10]]],['video','AI 视频工作流','让制作流程真正跑通',[['确定视频类型与样片标准',10],['梳理素材和脚本流程',15],['接通关键 API',20],['跑通视频制作工作流',25],['完成样片并修复问题',20],['整理产品和使用说明',10]]]];
function fresh(){return {version:2,revision:0,tasks:[],logs:[],habits:{},events:[],reports:[],reviews:[],ideas:[],projects:projectDefs.map(([id,name,desc,ms])=>({id,name,desc,block:'',next:'',milestones:ms.map(([name,weight])=>({id:uid(),name,weight,done:false,evidence:'',date:''}))})),settings:{start:'09:00',end:'18:00',lunchStart:'12:00',lunchEnd:'13:30',buffer:30,reading:3,autoReport:false},timer:{mode:'work',running:false,remaining:5400000,end:0}}}
let coachOriginalRaw=null;try{coachOriginalRaw=localStorage.getItem(KEY)}catch{};let protectedData=false;let state=fresh(),storageBroken=false,view='today',selected=today(),taskFilter='all';
try{const raw=localStorage.getItem(KEY);if(raw){const x=JSON.parse(raw);if(!validate(x))throw Error('invalid');state=x}}catch(e){storageBroken=true;protectedData=true}
function validate(x){const date=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d);return x&&x.version===2&&Number.isFinite(x.revision)&&['tasks','logs','events','reports','reviews','ideas','projects'].every(k=>Array.isArray(x[k]))&&x.habits&&typeof x.habits==='object'&&x.settings&&/^\d\d:\d\d$/.test(x.settings.start)&&/^\d\d:\d\d$/.test(x.settings.end)&&Number.isFinite(+x.settings.buffer)&&x.timer&&['work','rest'].includes(x.timer.mode)&&Number.isFinite(x.timer.remaining)&&Number.isFinite(x.timer.end)&&validPlanner(x)&&validCoach(x)&&x.projects.length>=3&&x.projects.every(p=>typeof p.id==='string'&&Array.isArray(p.milestones)&&p.milestones.every(m=>typeof m.name==='string'&&Number.isFinite(m.weight)&&m.weight>0))&&x.tasks.every(t=>typeof t.id==='string'&&typeof t.name==='string'&&Object.keys(domains).includes(t.domain)&&(t.date===''||date(t.date))&&['todo','blocked','done'].includes(t.status)&&Number.isFinite(t.minutes)&&t.minutes>=0)&&x.logs.every(l=>date(l.date)&&typeof l.text==='string'&&Object.keys(domains).includes(l.domain)&&(l.minutes===null||Number.isFinite(l.minutes)))&&x.events.every(e=>date(e.date)&&typeof e.name==='string')&&x.reports.every(r=>typeof r.text==='string')&&x.reviews.every(r=>date(r.date))&&(x.history===undefined||(Array.isArray(x.history)&&x.history.every(validHistoryRecord)))&&(x.historySources===undefined||(Array.isArray(x.historySources)&&x.historySources.every(validHistorySource)))&&Object.values(x.habits).every(h=>h&&Array.isArray(h.english)&&h.english.length===4&&Number.isFinite(h.reading)&&typeof h.workout==='boolean')}
function notify(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(notify.t);notify.t=setTimeout(()=>$('#toast').classList.add('hidden'),4000)}
function save(){if(protectedData){notify('原始数据读取异常，已阻止覆盖。请先导出备份或导入有效备份。');return false}try{const disk=localStorage.getItem(KEY);if(disk&&JSON.parse(disk).revision>state.revision){notify('另一个窗口已有更新。请先导出本页备份，再重新打开，避免覆盖。');return false}state.revision++;localStorage.setItem(KEY,JSON.stringify(state));storageBroken=false;$('#saveState').textContent='已保存 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});return true}catch(e){storageBroken=true;$('#saveState').textContent='保存失败，请导出备份';notify('本机保存失败，请立即导出备份。');return false}}
function commit(msg='已保存'){const ok=save();render();if(ok&&msg)notify(msg)}
function habit(d){return state.habits[d]||{english:[false,false,false,false],englishMinutes:0,reading:0,pages:0,book:'',workout:false,workoutMinutes:0,workoutNote:''}}
function progress(p){return Math.round(p.milestones.filter(m=>m.done).reduce((a,m)=>a+m.weight,0)/p.milestones.reduce((a,m)=>a+m.weight,0)*100)}
const training=d=>({2:'下肢 · 臀腿',4:'上肢 · 肩背',6:'有氧 + 腹部',0:'有氧 + 腹部'}[weekday(d)]||'恢复日 · 可选拉伸或散步');
const btn=(text,action,id='',cls='')=>`<button type="button" class="${cls}" data-action="${action}" data-id="${esc(id)}">${text}</button>`;
function nav(){const items=[['today','今日'],['work','工作'],['projects','目标'],['growth','成长'],['more','我的']];for(const id of ['desktopNav','mobileNav'])$('#'+id).innerHTML=items.map(([k,n])=>`<button data-view="${k}" class="${view===k?'active':''}">${n}</button>`).join('')}
function taskList(tasks){tasks=tasks.slice().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||(a.time||'99:99').localeCompare(b.time||'99:99'));return tasks.length?tasks.map(t=>`<div class="task ${t.status==='done'?'done':''}"><div class="body"><strong>${esc(t.name)}</strong><div class="meta"><span class="tag">${domains[t.domain]}</span>${t.core?'<span class="tag warn">今日重点</span>':''}${t.status==='blocked'?'<span class="tag warn">等待反馈</span>':''} ${esc(t.date||'收件箱')} ${t.time?esc(t.time):''} · 预计 ${t.minutes} 分钟${t.deadline?' · 最晚 '+esc(t.deadline):''}</div>${t.paused?'<span class="tag warn">已暂缓</span>':''}${t.followupDate?`<div class="meta">下次跟进 ${esc(t.followupDate)} · ${esc(t.contact||'未填联系人')}</div>`:''}${t.note?`<div class="meta">${esc(t.note)}</div>`:''}<div class="actions">${t.status==='done'?btn('重新打开','reopen',t.id):(btn('完成','quickDone',t.id,'primary')+btn('记录进展','feedback',t.id))}${btn('编辑 / 改期','editTask',t.id)}${t.status!=='done'?btn('接续 / 暂缓','continueTask',t.id):''}${t.domain==='work'&&t.status!=='done'?btn('跟进','followup',t.id):''}${btn('归档','archive',t.id)}</div></div></div>`).join(''):'<div class="empty">这里还没有任务。先添加一件准备推进的事。</div>'}
function minOf(t){const [h,m]=t.split(':').map(Number);return h*60+m}
function capacity(){const s=state.settings;return Math.max(0,minOf(s.end)-minOf(s.start)-Math.max(0,Math.min(minOf(s.end),minOf(s.lunchEnd))-Math.max(minOf(s.start),minOf(s.lunchStart))))}
function render(){nav();$('#date').value=selected;const titles={today:['我的一天','今天，先做好这几件事'],work:['公司工作','安排与跟进'],projects:['个人项目','把想法推进成产品'],growth:['个人成长','学习、体验与训练'],week:['本周重点','让这一周有一个成果'],more:['复盘与设置','记录，让进步看得见']};$('#eyebrow').textContent=titles[view][0];$('#pageTitle').textContent=titles[view][1];const warning=storageBroken?'<div class="notice error">本机数据读取或保存异常。请先导出备份；暂时不要清理浏览器数据。</div>':'';$('#app').innerHTML=warning+({today:renderToday,work:renderWork,projects:renderProjects,growth:renderGrowth,more:renderMore,week:renderWeek}[view])();updateTimer()}
function renderTodayLegacy(){const tasks=state.tasks.filter(t=>!t.archived&&t.date===selected&&(workday(selected)||t.domain!=='work'));const company=tasks.filter(t=>t.domain==='work'),personal=tasks.filter(t=>t.domain!=='work');const pending=company.filter(t=>t.status!=='done').reduce((a,t)=>a+t.minutes,0),budget=Math.round(capacity()*(1-state.settings.buffer/100));const core=tasks.filter(t=>t.core);return `<div class="card lead"><div class="section"><div><small class="meta">${selected} · 星期${'日一二三四五六'[weekday(selected)]}</small><h2>${workday(selected)?'留出余量，先推进最重要的一件事':'周末，把时间留给自己'}</h2></div>${btn('＋ 临时任务','newTask','','primary')}</div><p class="meta">${workday(selected)?`公司工作建议安排不超过 ${budget} 分钟，保留 ${state.settings.buffer}% 缓冲。`:'常规公司任务已收起，学习、活动与训练照常。'}</p></div><div class="stats"><div class="card"><small>重点已完成</small><span class="big">${core.filter(t=>t.status==='done').length} / ${core.length}</span></div><div class="card"><small>公司待办预计</small><span class="big">${pending}<small> 分钟</small></span></div><div class="card"><small>今日训练</small><b style="display:block;margin-top:6px">${habit(selected).workout?'已完成':training(selected)}</b></div></div>${pending>budget?'<div class="notice">今天公司任务已超出建议容量。请在“编辑 / 改期”中选择移走一项，系统不会自动占用你的晚间学习时间。</div>':''}<div class="grid"><div class="card"><div class="section"><h2>公司工作</h2>${btn('全部工作','goWork')}</div>${workday(selected)?taskList(company):'<div class="empty">今天休息。公司任务可在工作页查看。</div>'}</div><div class="card"><div class="section"><h2>个人安排</h2>${btn('记录成长','goGrowth')}</div>${taskList(personal)}<div class="notice">英语：${habit(selected).english.filter(Boolean).length}/4 项 · 阅读：${habit(selected).reading} 分钟</div></div></div><div class="card"><div class="section"><div><h2>专注与休息</h2><p class="meta">工作 90 分钟 · 休息 10 分钟。午休和非工作时段自动暂停；离开电脑前请手动暂停。</p></div></div><div class="actions"><span class="big timer" id="timerText">90:00</span><span id="timerMode" class="tag"></span>${btn(state.timer.running?'暂停':'开始 / 继续','timerToggle')}${btn('重新计时','timerReset')}</div><small>仅网页内提醒。关闭页面后不推送；重新打开会恢复已保存的计时状态。</small></div><div class="card"><h2>先把想法记下来</h2><div class="actions"><input id="ideaInput" placeholder="一句话记录，不立即挤进今天的计划" aria-label="新想法" style="flex:1">${btn('存入想法库','addIdea')}</div>${state.ideas.slice(0,5).map(i=>`<div class="log">${esc(i.text)} <small>${i.date}</small> ${btn('转为任务','ideaTask',i.id)}</div>`).join('')}</div>`}
function renderWork(){let ts=state.tasks.filter(t=>t.domain==='work'&&!t.archived);if(taskFilter==='today')ts=ts.filter(t=>t.date===selected);if(taskFilter==='pending')ts=ts.filter(t=>t.status!=='done');if(taskFilter==='inbox')ts=ts.filter(t=>!t.date);ts.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));return `<div class="card"><div class="section"><h2>工作清单</h2>${btn('＋ 添加工作','newWork','','primary')}</div><label>查看范围<select id="taskFilter">${[['all','全部工作'],['today','所选日期'],['pending','尚未完成'],['inbox','待安排']].map(([v,n])=>`<option value="${v}" ${taskFilter===v?'selected':''}>${n}</option>`).join('')}</select></label>${taskList(ts)}</div><div class="card"><h2>所选日期的工作反馈</h2>${state.logs.filter(l=>l.domain==='work'&&l.date===selected).map(l=>`<div class="log"><b>${esc(l.name)}</b><p>${esc(l.text)}</p><small>${l.minutes===null?'实际时长未记录':'实际 '+l.minutes+' 分钟'} · ${l.done?'已完成':'继续推进'}</small></div>`).join('')||'<p class="empty">尚无反馈。任务的预计时长不会计为实际工时。</p>'}${btn('整理公司日报','daily','','primary')}</div>`}

function renderGrowthLegacy(){const h=habit(selected),[a,b]=weekRange(selected),hs=Object.entries(state.habits).filter(([d])=>inside(d,a,b)),halfStart=selected.slice(0,8)+(+selected.slice(8)<=15?'01':'16'),halfEnd=+selected.slice(8)<=15?selected.slice(0,8)+'15':monthRange(selected)[1],events=state.events.filter(e=>inside(e.date,halfStart,halfEnd)&&e.attended);return `<div class="stats"><div class="card"><small>本周阅读</small><span class="big">${hs.filter(([,v])=>v.reading>0).length}/${state.settings.reading}<small> 天</small></span></div><div class="card"><small>本周训练</small><span class="big">${hs.filter(([,v])=>v.workout).length}/4<small> 天</small></span></div><div class="card"><small>本半月已参加活动</small><span class="big">${events.length}/1<small> 次</small></span></div></div><div class="grid"><div class="card"><h2>英语 · 每天一小时</h2><p class="meta">三句话日记、跟读、听力、阅读一页。四项时间可以灵活分配。</p>${['影子跟读 Shadowing','三句话英语日记','英语听力','阅读一页英文书'].map((n,i)=>`<label class="checklabel"><input type="checkbox" data-english="${i}" ${h.english[i]?'checked':''}>${n}</label>`).join('')}<label>今天实际英语时长（分钟）<input id="englishMinutes" type="number" min="0" max="1440" value="${h.englishMinutes||0}"></label>${btn('保存英语记录','saveEnglish','','primary')}<p class="meta" style="margin-top:12px">本周 ${hs.filter(([,v])=>(v.englishMinutes>0||v.english.some(Boolean))).length} 天有训练记录</p></div><div class="card"><h2>阅读与训练</h2><label>正在读的书<input id="book" value="${esc(h.book)}" placeholder="书名"></label><div class="formgrid"><label>阅读分钟<input id="reading" type="number" min="0" max="1440" value="${h.reading}"></label><label>阅读页数<input id="pages" type="number" min="0" max="9999" value="${h.pages}"></label></div><p><span class="tag">今日建议</span> ${training(selected)}</p><label class="checklabel"><input id="workout" type="checkbox" ${h.workout?'checked':''}>今天已完成一次训练</label><label>训练分钟<input id="workoutMinutes" type="number" min="0" max="1440" value="${h.workoutMinutes||0}"></label><label>训练内容 / 感受<textarea id="workoutNote">${esc(h.workoutNote)}</textarea></label>${btn('保存阅读与训练','saveHealth','','primary')}<small style="display:block;margin-top:8px">同一天力量、有氧和腹部合计为一个训练日。</small></div></div><div class="card"><div class="section"><div><h2>外出学习与活动</h2><small>当前半月：${halfStart} 至 ${halfEnd} · 报名不计入完成</small></div>${btn('＋ 活动','event','','primary')}</div>${state.events.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<div class="log"><b>${esc(e.name)}</b> <span class="tag">${e.attended?'已参加':'计划参加'}</span><small>${e.date}</small><p>${esc(e.note)}</p>${btn('编辑 / 记录收获','event',e.id)}</div>`).join('')||'<p class="empty">安排一次分享会、展览或交流活动，给自己一些新体验。</p>'}</div>`}

function taskForm(id,domain='work',project='',name=''){const t=state.tasks.find(t=>t.id===id)||{name,domain,project,date:domain==='work'&&!workday(selected)?nextWorkday(selected):selected,minutes:30,status:'todo',time:'',deadline:'',note:'',core:false};openForm(id?'编辑任务':'添加任务',field('name','准备完成什么',t.name,'text','required maxlength="200"')+`<div class="formgrid"><label>所属板块<select name="domain">${Object.entries(domains).map(([k,n])=>`<option value="${k}" ${t.domain===k?'selected':''}>${n}</option>`).join('')}</select></label><label>关联个人项目（可选）<select name="project"><option value="">不关联</option>${state.projects.map(p=>`<option value="${p.id}" ${p.id===t.project?'selected':''}>${p.name}</option>`).join('')}</select></label>${field('date','计划日期（留空放入收件箱）',t.date,'date')}${field('time','开始时间（可不填）',t.time,'time')}${field('minutes','预计分钟',t.minutes,'number','min="1" max="1440" required')}${field('deadline','最晚完成日期',t.deadline,'date')}</div><label class="checklabel"><input name="core" type="checkbox" ${t.core?'checked':''}>设为当天重点（最多三件）</label><label>当前状态<select name="status">${[['todo','待推进'],['blocked','等待反馈'],['done','已完成']].filter(([k])=>k!=='done'||t.status==='done').map(([k,n])=>`<option value="${k}" ${t.status===k?'selected':''}>${n}</option>`).join('')}</select></label>`+area('note','备注 / 等待谁反馈',t.note)+submit('保存任务'),f=>{const date=f.get('date'),domain=f.get('domain'),time=f.get('time'),minutes=+f.get('minutes'),core=f.has('core');if(domain==='work'&&date&&!workday(date)){notify('公司任务请选择非休假工作日；留空可以暂存。');return}if(core&&(!date||state.tasks.filter(x=>!x.archived&&x.id!==id&&x.date===date&&x.core).length>=3)){notify('重点需要指定日期，每天最多三件。');return}if(date&&time){const overlap=state.tasks.some(x=>!x.archived&&x.id!==id&&x.date===date&&x.time&&minOf(time)<minOf(x.time)+x.minutes&&minOf(time)+minutes>minOf(x.time));if(overlap){notify('这个时间与已有任务重叠，请改时间或留空。');return}if(domain==='work'&&(minOf(time)<minOf(state.settings.start)||minOf(time)+minutes>minOf(state.settings.end)||(minOf(time)<minOf(state.settings.lunchEnd)&&minOf(time)+minutes>minOf(state.settings.lunchStart)))){notify('请安排在公司工作时段内，并避开午休。');return}}const item={...t,id:id||uid(),name:f.get('name').trim(),domain,project:f.get('project'),date,time,minutes,deadline:f.get('deadline'),core,status:f.get('status'),note:f.get('note'),archived:false};if(!item.name)return;if(id)state.tasks=state.tasks.map(x=>x.id===id?item:x);else state.tasks.push(item);$('#modal').close();commit('任务已保存，不会自动移动其他安排。')})}
function feedback(id){const t=state.tasks.find(x=>x.id===id);openForm('记录进展',`<p>${esc(t.name)}</p>`+field('date','实际发生日期',selected,'date','required')+area('text','这次完成了什么 / 还有什么卡点')+field('minutes','实际分钟（可留空）','','number','min="0" max="1440"')+`<label class="checklabel"><input name="done" type="checkbox">这项任务已经全部完成</label>`+submit('保存进展'),f=>{if(f.get('date')>today()){notify('实际进展日期不能晚于今天。');return}if(!f.get('text').trim()){notify('请写一句实际进展，再保存。');return}state.logs.push({id:uid(),taskId:id,name:t.name,domain:t.domain,project:t.project,date:f.get('date'),text:f.get('text').trim(),minutes:f.get('minutes')===''?null:+f.get('minutes'),done:f.has('done')});if(f.has('done')){t.status='done';t.completedAt=f.get('date')}$('#modal').close();commit('进展已保存，报告将按实际发生日期统计。')})}
function reportData(kind,d){let [a,b]=kind.includes('week')?weekRange(d):kind.includes('month')?monthRange(d):[d,d];b=b>d?d:b;const work=!kind.startsWith('personal');const logs=state.logs.filter(l=>inside(l.date,a,b)&&(work?l.domain==='work':l.domain!=='work'));const lines=[`${work?'公司':'个人'}${kind.includes('week')?'周':kind.includes('month')?'月':'日'}总结`,`${a} 至 ${b}（截至所选日期）`,'','一、实际进展',...logs.map(l=>`• ${l.date} ${l.name}：${l.text}${l.done?' [完成]':''}`)];if(!logs.length)lines.push('尚无实际进展反馈，不推断完成情况。');lines.push('',`记录的实际投入：${logs.reduce((s,l)=>s+l.minutes,0)} 分钟（不含未记录工时）`);if(work){const pending=state.tasks.filter(t=>!t.archived&&t.domain==='work'&&t.status!=='done'&&(!t.date||t.date<=b));lines.push('','二、待跟进 / 阻碍',...pending.map(t=>`• ${t.name}${t.status==='blocked'?' [等待反馈]':''}${t.note?'：'+t.note:''}`));if(!pending.length)lines.push('暂无已记录的待跟进事项。');lines.push('',`三、下一工作日 ${nextWorkday(b)}`, ...state.tasks.filter(t=>!t.archived&&t.domain==='work'&&t.date===nextWorkday(b)&&t.status!=='done').map(t=>'• '+t.name),'请结合实际情况补充下一步。')}else{const hs=Object.entries(state.habits).filter(([d])=>inside(d,a,b));lines.push('','二、成长与运动',`英语训练：${hs.filter(([,h])=>(h.englishMinutes>0||h.english.some(Boolean))).length} 天，实际 ${hs.reduce((s,[,h])=>s+(h.englishMinutes||0),0)} 分钟`,`阅读：${hs.filter(([,h])=>h.reading>0).length} 天，${hs.reduce((s,[,h])=>s+h.reading,0)} 分钟，${hs.reduce((s,[,h])=>s+h.pages,0)} 页`,`训练：${hs.filter(([,h])=>h.workout).length} 天`,`已参加活动：${state.events.filter(e=>e.attended&&inside(e.date,a,b)).length} 次`,'','三、期间验收成果',...state.projects.flatMap(p=>p.milestones.filter(m=>m.done&&inside(m.date,a,b)).map(m=>`• ${p.name} / ${m.name}：${m.evidence}`)),'','四、个人复盘',...state.reviews.filter(r=>inside(r.date,a,b)).map(r=>`${r.date}：${r.text}`))}if(work&&kind==='workmonth'){const rows=(state.history||[]).filter(r=>r.precision==='month'&&r.period===d.slice(0,7)&&['月度数据','月度成果'].includes(r.category)&&r.status!=='月份待核对');if(rows.length)lines.push('','四、历史月报资料（不计新增任务或工时）',...rows.map(r=>r.title+'：'+r.text+'\n来源：'+r.source+' 第'+r.page+'页'))}return lines.join('\n')}
function makeReport(kind,d=selected,auto=false){if(kind==='daily'&&!workday(d)){notify('休息日不生成公司日报。');return}if($('#modal').open)$('#modal').close();const key=kind+':'+d,old=state.reports.filter(r=>r.key===key),text=reportData(kind,d),r={id:uid(),key,kind,date:d,title:({daily:'公司日报',workweek:'公司周报',workmonth:'公司月报',personalweek:'个人周总结',personalmonth:'个人月总结'}[kind])+' · '+d,version:old.length+1,text,created:new Date().toISOString(),auto};state.reports.push(r);commit(auto?'今天的公司日报已整理，可在“我的”查看。':'报告草稿已保存');if(!auto)showReport(r.id)}

function showReport(id){const r=state.reports.find(x=>x.id===id);openForm(r.title,area('text','报告内容（可修改后另存一版）',r.text)+`<div class="actions"><button type="submit" class="primary">保存新版本</button>${btn('导出 TXT','exportReport',r.id)}</div>`,f=>{state.reports.push({...r,id:uid(),text:f.get('text'),version:state.reports.filter(x=>x.key===r.key).length+1,created:new Date().toISOString(),auto:false});$('#modal').close();commit('新版本已保存，原版本保留。')})}
function eventForm(id){const e=state.events.find(x=>x.id===id)||{name:'',date:selected,note:'',attended:false};openForm('外出学习与活动',field('name','活动名称',e.name,'text','required maxlength="200"')+field('date','活动日期',e.date,'date','required')+area('note','地点 / 收获 / 下一步',e.note)+`<label class="checklabel"><input type="checkbox" name="attended" ${e.attended?'checked':''}>我已经参加了</label>`+submit('保存活动'),f=>{const item={id:id||uid(),name:f.get('name').trim(),date:f.get('date'),note:f.get('note'),attended:f.has('attended')};if(item.attended&&item.date>today()){notify('未来的活动请先标记为计划参加。');return}if(state.events.some(x=>x.id!==id&&x.name===item.name&&x.date===item.date)){notify('同日同名活动已经存在，请编辑原记录。');return}if(id)state.events=state.events.map(x=>x.id===id?item:x);else state.events.push(item);$('#modal').close();commit()})}

 if(!plan&&isNow&&!protectedData){plan=buildCoachDay(d);save()}
 if(!plan)return `<div class="card lead"><h2>${d>today()?'到当天，再按最新进度安排三件事':'这一天没有自动清单'}</h2><p class="meta">不提前堆积任务，也不凭空补写过去的完成记录。</p>${btn('回到今天','coachToday')}</div><div class="card">${btn('查看已有工作','goWork')}${btn('成长记录','goGrowth')}</div>`;
 const done=plan.items.filter(i=>coachDone(i,d)).length,urgent=coachCandidates(d).filter(t=>coachRank(t,d)<=1&&!plan.items.some(i=>i.id===t.id));
 return `<div class="card lead"><div class="section"><div><small class="meta">${d} · ${workday(d)?'工作日':'休息日'} · 每日执行助理</small><h2>今天就推进这三件事</h2></div><strong class="big">${done} / 3</strong></div><p class="meta">${done===3?'今天的三项已完成，不再自动追加任务。下一步会在后续清单中接上。':'按优先顺序做，完成就打卡；下一步由助理接续。'}</p><div class="actions">${btn('＋ 临时任务','newTask')}${btn('提醒与当前阶段','coachSettings')}${btn('主线进度','goProjects')}</div></div>
 ${urgent.length?`<div class="notice">另有 ${urgent.length} 项已到截止或跟进日：${urgent.slice(0,2).map(t=>esc(t.name)).join('、')}。当前卡片已经开始或处理，未被自动替换。${btn('查看并调整工作','goWork')}</div>`:''}
 ${plan.changes.length?`<div class="notice">${plan.changes.slice(-2).map(esc).join('<br>')}</div>`:''}
 <div id="coachReminder" class="notice" role="status">${isNow?coachReminderText(d):'历史清单 · 展示所保存的安排'}</div>
 <div class="coach-stack">${plan.items.map((i,n)=>coachCard(i,d,n,!isNow)).join('')}</div>
 <div class="card"><div class="section"><h2>今天之外，助理也记着</h2>${btn('查看全部工作','goWork')}</div><p class="meta">${state.tasks.filter(t=>!t.archived&&t.status!=='done'&&!plan.items.some(i=>i.id===t.id)).length} 项在候选队列。完成的卡片今天保留；未完成步骤继续接续；等待反馈按约定日期提醒。</p><details><summary>本周成果与健康提醒</summary>${coachWeekSummary(d)}<p>今日训练：${training(d)} ${btn(habit(d).workout?'✓ 已完成训练':'训练打卡','quickWorkout')}</p><div class="actions">${btn('本周详情','goWeek')}${btn('阅读 / 外出活动','goGrowth')}</div></details></div>
 <details class="card"><summary>专注 90 分钟，休息 10 分钟</summary><div class="actions"><b id="timerText" class="timer">90:00</b><span id="timerMode"></span>${btn(state.timer.running?'暂停':'开始 / 继续','timerToggle')}${btn('重置','timerReset')}</div><small>限工作时段；关闭网页后计时提醒不运行。</small></details>`;
}
function coachWeekSummary(d){const [a,b]=weekRange(d),logs=state.logs.filter(l=>l.done&&inside(l.date,a,b)),hs=Object.entries(state.habits).filter(([day])=>inside(day,a,b));return `<p>本周记录：完成 ${new Set(logs.map(l=>l.taskId)).size} 项任务 · 英语 ${hs.reduce((s,[,h])=>s+(h.englishMinutes||0),0)} 分钟 · 训练 ${hs.filter(([,h])=>h.workout).length}/4 天 · 阅读 ${hs.filter(([,h])=>h.reading>0).length}/${state.settings.reading} 天</p>${logs.slice(-6).map(l=>`<p class="meta">✓ ${esc(l.name)}</p>`).join('')}<p class="meta">成果按实际反馈统计，不根据计划猜测完成。</p>`}
function coachLocalTime(){return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date())}
function coachReminderText(d){const p=state.coach.days[d];if(!p)return '';const n=p.items.findIndex(i=>!coachClosed(i,d));if(n<0)return '今天已处理完三项，明天接着推进。';const i=p.items[n],s=coachItemText(i,d);return `接下来：${s.title}。提醒时点 ${[state.coach.times.first,state.coach.times.second,state.coach.times.english][n]}（北京时间）。`}
function coachCanAct(){if(selected!==today()){notify('自动清单只在当天打卡；历史补录请到工作或成长页面。');return false}return true}
function coachCheckinHTML(t){return `<p>${esc(t.name)}</p><div class="notice">完成标准：${esc(t.coachAccept||'任务约定的交付已完成')}</div><label>这次的结果<select name="result"><option value="done">已经完成</option><option value="partial">只完成了一部分</option><option value="waiting">还在等待反馈</option></select></label>`+field('minutes','实际分钟（可不填）','','number','min="0" max="1440"')+field('evidence','成果链接或一句补充（可不填）','','text','maxlength="2000"')+field('next','未完成时，下次跟进日期',t.domain==='work'?nextWorkday(selected):addDays(selected,1),'date','required')+submit('确认打卡')}
actions.coachToday=()=>{selected=today();view='today';render()};
actions.coachStart=id=>{if(!coachCanAct())return;const t=state.tasks.find(t=>t.id===id);if(!t||t.status==='done')return;t.coachStarted=true;commit('已开始，这项不会被新增临时任务自动替换。')};
actions.coachCheckin=id=>{if(!coachCanAct())return;const t=state.tasks.find(t=>t.id===id);if(!t||t.status==='done')return;if(t.status!=='blocked'){if(completeTask(id))commit('已打卡；下一次按实际进度接续，不追加今天的任务。');return}openForm('打卡即可，不必写日记',coachCheckinHTML(t),f=>{const result=f.get('result'),next=f.get('next');if(result!=='done'&&(!next||next<=selected||(t.domain==='work'&&!workday(next)))){notify('请选择后续可跟进的日期；公司工作避开休息日。');return}const minutes=f.get('minutes')===''?null:+f.get('minutes');if(minutes!==null&&!validNum(minutes)){notify('请检查实际分钟');return}state.logs.push({id:uid(),taskId:id,name:t.name,domain:t.domain,project:t.project,date:selected,text:f.get('evidence').trim()||(result==='done'?'已按完成标准完成':result==='waiting'?'等待反馈，已约定下次跟进':'完成一部分，后续继续'),minutes,done:result==='done'});if(result==='done'){t.status='done';t.completedAt=selected;t.paused=false;delete state.coach.snoozed[selected+':'+id]}else{t.status=result==='waiting'?'blocked':'todo';t.date=next;t.time='';t.followupDate=result==='waiting'?next:'';state.coach.snoozed[selected+':'+id]=true;t.coachStarted=false}$('#modal').close();commit(result==='done'?'已打卡；后续清单会接上下一步。':'已保存进度，到约定日期再提醒。')})};
actions.coachHold=id=>{if(!coachCanAct())return;const t=state.tasks.find(t=>t.id===id);openForm('这件事怎么接续',`<p>${esc(t.name)}</p><label>当前情况<select name="reason"><option value="partial">今天时间不够，继续接续</option><option value="waiting">等待他人 / 接口 / 资料</option></select></label>`+field('date','下次接续或跟进',t.domain==='work'?nextWorkday(selected):addDays(selected,1),'date','required')+field('note','卡点（一句话，可不填）',t.coachBlock||'')+submit('保存，届时提醒'),f=>{const d=f.get('date');if(!d||d<=selected||(t.domain==='work'&&!workday(d))){notify('请选择之后的可执行日期');return}t.date=d;t.time='';t.status=f.get('reason')==='waiting'?'blocked':'todo';t.followupDate=t.status==='blocked'?d:'';t.coachBlock=f.get('note');t.coachStarted=false;state.coach.snoozed[selected+':'+id]=true;$('#modal').close();commit('已记录接续日期，今天不追加替代任务。')})};
actions.coachUndo=id=>{if(!coachCanAct())return;const t=state.tasks.find(t=>t.id===id);openForm('撤销这次完成',`<p>将「${esc(t.name)}」恢复为待做，并撤回今天这次完成记录；以前的进展保留。</p>`+submit('确认撤销'),()=>{state.logs=state.logs.filter(l=>!(l.taskId===id&&l.date===selected&&l.done));t.status='todo';delete t.completedAt;$('#modal').close();commit('已撤销完成，后续先接续这一步。')})};
actions.coachReading=()=>{if(!coachCanAct())return;const h=habit(selected);h.reading=Math.max(h.reading,20);state.habits[selected]=h;commit('已记录今天至少阅读20分钟；精确时长可在成长页修改。')};
actions.coachReview=()=>{openForm('本周成果，系统替你整理',coachWeekSummary(selected)+submit('已看过'),()=>{if(coachCanAct()){state.coach.completed[selected+':review']=true;$('#modal').close();commit('本周回顾已确认，无需另写周记。')}})};
actions.coachSettings=()=>{const c=ensureCoach();openForm('一次设定，之后按进度接续',`<p>每天三项：工作日优先企业提效和唯一产品；周末保留个人安排。英语每天固定。临时事项替换尚未开始的自动任务，不追加第四项。</p><div class="formgrid">`+field('first','第一项提醒',c.times.first,'time','required')+field('second','第二项提醒',c.times.second,'time','required')+field('english','英语打卡提醒',c.times.english,'time','required')+`</div><label class="checklabel"><input name="reminders" type="checkbox" ${c.reminders?'checked':''}>网页打开时提醒（北京时间）</label><p class="meta">以上是提醒时点，不强行占用日历。页面关闭、设备休眠时网页无法准时通知。手机电脑的本机进度仍不互通。</p><div class="actions">${btn('开启浏览器通知','coachNotify')}${btn('一次定位已有进度','coachPosition')}${btn('休假设置','holiday')}</div><p class="meta">已经完成过某阶段？只需定位一次，不必每天想下一步。日期可在页面右上角查看。</p>`+submit('保存提醒时间'),f=>{const times=Object.fromEntries(['first','second','english'].map(k=>[k,f.get(k)]));if(!(times.first<times.second&&times.second<times.english)){notify('请按第一项、第二项、英语的先后顺序设置时间');return}c.times=times;c.reminders=f.has('reminders');$('#modal').close();commit('提醒偏好已保存')})};
actions.coachNotify=async()=>{if(!('Notification' in window)){notify('当前浏览器不支持网页通知；页面内提醒仍可用。');return}try{const p=await Notification.requestPermission();notify(p==='granted'?'网页通知已开启；页面关闭后不运行。':'未获得通知权限，保留页面内提醒。')}catch{notify('浏览器未允许通知，页面内提醒仍可用。')}};
actions.coachPosition=()=>{if($('#modal').open)$('#modal').close();const c=ensureCoach();openForm('只定位一次当前阶段',`<p>选择接下来真正需要做的步骤。此前步骤标为跳过，不伪造完成记录；现有项目验收和工作记录保留。</p>`+['ai','saas'].map(track=>`<label>${track==='ai'?'企业 AI 提效':'一人市场 SaaS'}<select name="${track}">${coachRoutes[track].map((s,n)=>`<option value="${n}" ${c.positions[track]===n?'selected':''}>${n+1}. ${esc(s[0])}</option>`).join('')}<option value="${coachRoutes[track].length}" ${c.positions[track]>=coachRoutes[track].length?'selected':''}>已跑通基础闭环，进入使用反馈与持续迭代</option></select></label>`).join('')+submit('保存定位'),f=>{for(const track of ['ai','saas']){const pos=+f.get(track);if(pos===c.positions[track]||(pos===coachRoutes[track].length&&c.positions[track]>=pos))continue;for(const t of state.tasks.filter(t=>t.coachTrack===track&&t.status!=='done'&&!t.archived)){t.archived=true;t.coachSkipped=true}c.positions[track]=pos;}const p=c.days[today()];if(p)for(let j=0;j<2;j++){const t=coachTask(p.items[j]);if(t?.coachSkipped){const next=nextCoachTask(t.coachTrack,today());if(next)p.items[j]=coachTaskItem(next,'从你确认的当前阶段继续')}}$('#modal').close();commit('定位已保存，没有把跳过的阶段算成完成。')})};
// Stage context is visible in Goals; legacy milestone evidence remains independent.
const coachLegacyProjects=renderProjects;
renderProjects=function(){const c=ensureCoach();return `<div class="card lead"><h2>一条主航道，一个独立产品</h2><p>英语提供长期选择权；企业 AI 提效积累专业能力；一人市场练习完整产品交付；公众号从实践中记录与获客。</p><small class="meta">新方向只问：是否加强企业 AI 提效，或帮助一人市场上线？两个都不是，先不做。</small></div><div class="grid">${['ai','saas'].map(track=>`<div class="card"><h2>${track==='ai'?'企业 AI 提效 · 主航道':'一人市场 · 唯一产品'}</h2><p>下一步：${esc(coachStep(track,c.positions[track])[0])}</p><p class="meta">已实际完成 ${state.tasks.filter(t=>t.coachTrack===track&&t.status==='done').length} 个执行步骤。基础路径 ${coachRoutes[track].length} 步，之后持续验证和迭代；定位跳过不计成果。</p>${btn('校准当前阶段','coachPosition')}</div>`).join('')}</div>`+coachLegacyProjects()};
renderToday=renderCoachToday;
const coachLegacyCommit=commit;
commit=function(msg='已保存'){syncCoachSteps();if(selected===today())rebalanceCoachDay(selected);coachLegacyCommit(msg)};
const coachLegacyMore=renderMore;
renderMore=function(){return `<div class="card"><h2>每日三项执行助理</h2><p>每天按实际进度选三件事；完成就打卡，不要求写日记。网页内可定时提醒；关闭网页后的站外提醒无法读取本机进度。</p>${btn('当前阶段与提醒时间','coachSettings')}${btn('下载执行版升级前备份','coachBackup')}</div>`+coachLegacyMore()};
actions.coachBackup=()=>{const raw=localStorage.getItem(KEY+'-before-coach');if(raw)download('日有进_执行版升级前备份.json',raw,'application/json');else notify('没有升级前快照，可导出当前全部备份。')};
// Ensure old backup imports and reset states acquire the new optional schema.
const coachLegacyRender=render;
render=function(){ensureCoach();coachLegacyRender()};
if(!protectedData){try{const raw=coachOriginalRaw;if(raw&&!state.coach&&!localStorage.getItem(KEY+'-before-coach'))localStorage.setItem(KEY+'-before-coach',raw);ensureCoach();save()}catch(e){storageBroken=true;ensureCoach()}}else ensureCoach();
let coachSeenDate=today();
function coachTick(){
 if(protectedData)return;const now=today();
 if(now!==coachSeenDate){const before=coachSeenDate;coachSeenDate=now;if(selected===before&&!$('#modal').open){selected=now;if(view==='today')render()}return}
 const c=ensureCoach(),plan=c.days[now];if(!plan||!c.reminders)return;
 const time=coachLocalTime();let changed=false;
 for(let n=0;n<3;n++){const i=plan.items[n],at=[c.times.first,c.times.second,c.times.english][n],key=n+':'+(i.id||i.kind)+':'+at;
  if(coachClosed(i,now)||time<at||plan.reminded[key])continue;
  plan.reminded[key]=true;changed=true;
  // After resuming a suspended tab, show one useful reminder, not a burst of old alerts.
  const text='日有进：'+coachItemText(i,now).title+'。完成后打卡，未完成可设置接续。';
  notify(text);if('Notification' in window&&Notification.permission==='granted'){try{new Notification('今日三件事',{body:text,tag:'riyoujin-daily',icon:undefined})}catch{}}
  break;
 }
 if(changed)save();
 const node=document.querySelector('#coachReminder');if(node&&selected===now)node.textContent=coachReminderText(now);
}
setInterval(coachTick,60000);

render();
</script></body></html>
